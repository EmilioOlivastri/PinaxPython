[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "uwsfm"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "pyyaml",
    "tqdm",
    "numba",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["uwsfm*"]
